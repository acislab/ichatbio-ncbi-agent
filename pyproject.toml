[project]
name = "ichatbio-ncbi-agent"
version = "1"
requires-python = ">=3.12"
dependencies = [
    "ichatbio-sdk==0.2.8",
    "openai>=3.0.0",
    "pydantic==2.14.1",
    "instructor==1.17.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "uvicorn==0.54.0",
    "python-dotenv==1.2.4",
    "httpx==0.28.1",
    "tenacity==9.2.1",
    "xmltodict==1.0.4",
    "defusedxml==0.7.1",
]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
log_cli = true
log_cli_level = "INFO"
